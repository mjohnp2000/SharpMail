<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SharpMail – Rewrite Emails with Confidence</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 800px;
      padding: 0 20px;
      background-color: #f8f8f8;
      color: #333;
    }
    h1, h2 {
      text-align: center;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      padding: 10px;
      font-size: 1rem;
      margin-top: 8px;
      margin-bottom: 20px;
    }
    select, button {
      font-size: 1rem;
      padding: 10px;
      margin-right: 10px;
      margin-bottom: 20px;
    }
    #output {
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 15px;
      min-height: 100px;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>SharpMail</h1>
  <h2>Rewrite emails with confidence.</h2>

  <label for="input">Paste your message below:</label>
  <textarea id="input" placeholder="hey, haven’t heard back yet. wondering if you're still interested..."></textarea>

  <label for="tone">Choose a tone:</label>
  <select id="tone">
    <option>Friendly Casual</option>
    <option>Assertive Casual</option>
    <option>Friendly Formal</option>
    <option>Assertive Formal</option>
    <option>Friendly Professional</option>
    <option>Assertive Professional</option>
  </select>

  <button id="rewriteBtn">Rewrite Email</button>

  <h3>Polished Email:</h3>
  <div id="output">Your improved email will appear here.</div>

  <button onclick="copyOutput()">Copy to Clipboard</button>
  <button onclick="regenerate()">Try Again</button>

  <footer>
    Powered by OpenAI | Contact | Privacy
  </footer>

  <script>
  function copyOutput() {
    const output = document.getElementById('output').innerText;
    navigator.clipboard.writeText(output);
    alert("Copied!");
  }

  function regenerate() {
    alert("This will regenerate in full version.");
  }

  function buildPrompt(input, tone) {
    return `
You are a professional email editor. Rewrite the following message in a ${tone} tone. The result should be clear, well-structured, and grammatically correct. Maintain the original meaning, but improve the flow and professionalism as appropriate for the selected tone.

Only return the revised message—do not include explanations or headings.

Message:
"""
${input}
"""`;
  }

  async function sendToOpenAI(prompt) {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer YOUR_API_KEY" // Replace with your API key for local testing
      },
      body: JSON.stringify({
        model: "gpt-4", // or "gpt-3.5-turbo"
        messages: [
          {
            role: "system",
            content: "You are a professional email editor."
          },
          {
            role: "user",
            content: prompt
          }
        ],
        temperature: 0.7
      })
    });

    const data = await response.json();
    return data.choices[0].message.content;
  }

  document.getElementById("rewriteBtn").addEventListener("click", async () => {
    const input = document.getElementById("input").value;
    const tone = document.getElementById("tone").value;
    const prompt = buildPrompt(input, tone);

    document.getElementById("output").innerText = "Rewriting...";

    try {
      const polished = await sendToOpenAI(prompt);
      document.getElementById("output").innerText = polished;
    } catch (err) {
      document.getElementById("output").innerText = "Error: " + err.message;
    }
  });
</script>

</body>
</html>
